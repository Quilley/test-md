<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document title</title>
  <!-- ihd:styles -->
</head>
<body>
  <a class="ihd-skip" href="#content">Skip to content</a>
  <!-- Primitive kit sprite. Keep it when any figure uses arrowheads, hatching, markers or rating balls; delete it otherwise.
       It must stay rendered (zero size), not display:none, or markers and patterns disappear. -->
  <svg class="ihd-sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <marker id="ihd-arrow-closed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#191919"/></marker>
      <marker id="ihd-arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#191919" stroke-width="1.6"/></marker>
      <marker id="ihd-arrow-bar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M5 0V10" stroke="#191919" stroke-width="2"/></marker>
      <pattern id="ihd-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#191919" stroke-width="1"/></pattern>
      <symbol id="ihd-m-circle" viewBox="-6 -6 12 12"><circle r="5"/></symbol>
      <symbol id="ihd-m-square" viewBox="-6 -6 12 12"><rect x="-5" y="-5" width="10" height="10"/></symbol>
      <symbol id="ihd-m-triangle" viewBox="-6 -6 12 12"><polygon points="0,-6 6,5 -6,5"/></symbol>
      <symbol id="ihd-m-diamond" viewBox="-6 -6 12 12"><polygon points="0,-6 6,0 0,6 -6,0"/></symbol>
      <symbol id="ihd-h-0" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
      <symbol id="ihd-h-1" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 12V2A10 10 0 0 1 22 12Z" fill="currentColor"/></symbol>
      <symbol id="ihd-h-2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 12V2A10 10 0 0 1 12 22Z" fill="currentColor"/></symbol>
      <symbol id="ihd-h-3" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 12V2A10 10 0 1 1 2 12Z" fill="currentColor"/></symbol>
      <symbol id="ihd-h-4" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="currentColor" stroke-width="1.5"/></symbol>
    </defs>
  </svg>
  <div class="ihd-page">
    <header class="ihd-masthead">
      <span class="ihd-mark">Internal working document</span>
    </header>
    <!-- Long documents: wrap the contents disclosure and main in <div class="ihd-doc">, contents first
         (see examples/source/system-explainer.html). The reader turns it into a sticky rail from 80rem.
         Short documents: use main alone, as below. -->
    <main id="content">
      <header class="ihd-hero">
        <p class="ihd-eyebrow">Document type</p>
        <h1>Document title</h1>
        <!-- Add a deck only when it contributes context. -->
      </header>
      <!-- Use .ihd-section.ihd-reading.ihd-prose for reading groups and .ihd-visual inside responsive figures. -->
    </main>
    <footer class="ihd-footer"><span>Internal use</span></footer>
  </div>
  <!-- ihd:reader -->
</body>
</html>
